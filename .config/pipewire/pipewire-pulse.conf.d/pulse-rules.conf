pulse.rules = [
    {
        # ZOOM Audio fix
        matches = [ { application.name = "ZOOM VoiceEngine" } ]
        actions = {
            update-props = {
                pulse.min.quantum      = 1024/48000     # 21ms
            }
        }
    }
    {
        # Stop Ferdium from changing my input volume
        matches = [ { application.name = "Chromium input" } ]
        actions = { quirks = [ block-source-volume ] }
    }
}
