env:
  # Saner default $TERM
  TERM: xterm-256color

window:
  # Blank space added around the window in pixels
  padding:
    x: 2
    y: 2
  # Transparency
  opacity: 0.9

# Font configuration
font:
  # Normal (roman) font face
  normal:
    family: xos4 Terminus
    style: Regular

  # Bold font face
  bold:
    family: xos4 Terminus
    style: Bold

  # Italic font face
  italic:
    family: xos4 Terminus
    style: Italic

  # Bold italic font face
  bold_italic:
    family: xos4 Terminus
    style: Bold Italic

  # Point size
  size: 10

  # Bold text is drawn using the bright color variants
  draw_bold_text_with_bright_colors: true

colors:
  # Default colors
  primary:
    background: '#1C1C1C'
    foreground: '#EFEFEF'

  # Normal colors
  normal:
    black:   '#262626'
    red:     '#D44A40'
    green:   '#98CB3C'
    yellow:  '#D4B63C'
    blue:    '#5A89C4'
    megenta: '#904AC4'
    cyan:    '#5ACBBE'
    white:   '#A5A5A5'

  # Bright colors:
  bright:
    black:   '#3F3F3F'
    red:     '#D4746A'
    green:   '#AFCB66'
    yellow:  '#D4BE66'
    blue:    '#847FC4'
    megenta: '#A774C4'
    cyan:    '#84CBBE'
    white:   '#C5C5C5'

selection:
  # All characters that are used as separators for "semantic words"
  semantic_escape_chars: "`\"',;@&*=|?: ()[]{}<>\t"

cursor:
  # Cursor style
  style:
    shape: Block
    blinking: On

  # Cursor blinking interval
  blink_interval: 550

  # Cursor will be a hollow box when the window is not focused
  unfocused_hollow: true

# Additional key bindings
key_bindings:
  - { key: V,        mods: Control|Alt, action: Paste   }
  - { key: C,        mods: Control|Alt, action: Copy    }

