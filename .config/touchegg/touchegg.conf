<touchégg>
  <settings>
    <!-- Gesture recognition timing (in ms), controls debounce/delay between repeated actions -->
    <property name="animation_delay">150</property>
    <!-- Minimum gesture movement threshold; adjust if needed -->
    <property name="action_execute_threshold">20</property>
  </settings>

  <application name="All">
    <!-- Workspace Navigation -->
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="RUN_COMMAND">
        <command>i3-msg workspace next</command>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="RUN_COMMAND">
        <command>i3-msg workspace prev</command>
      </action>
    </gesture>

    <!-- Window Fullscreen Toggle -->
    <gesture type="SWIPE" fingers="4" direction="UP">
      <action type="RUN_COMMAND">
        <command>i3-msg fullscreen toggle</command>
      </action>
    </gesture>

    <!-- Floating Toggle -->
    <gesture type="SWIPE" fingers="4" direction="DOWN">
      <action type="RUN_COMMAND">
        <command>i3-msg floating toggle</command>
      </action>
    </gesture>

    <!-- Move focused container to previous workspace -->
    <gesture type="SWIPE" fingers="4" direction="LEFT">
      <action type="RUN_COMMAND">
        <command>i3-msg move container to workspace prev</command>
      </action>
    </gesture>

    <!-- Move focused container to next workspace -->
    <gesture type="SWIPE" fingers="4" direction="RIGHT">
      <action type="RUN_COMMAND">
        <command>i3-msg move container to workspace next</command>
      </action>
    </gesture>
  </application>

  <application name="code">
    <!-- VSCode: Open Command Palette -->
    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="SEND_KEYS">
        <modifiers>Control_L</modifiers>
        <keys>Shift_L+p</keys>
      </action>
    </gesture>

    <!-- VSCode: Toggle Terminal -->
    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="SEND_KEYS">
        <modifiers>Control_L</modifiers>
        <keys>Shift_L+grave</keys>
      </action>
    </gesture>
  </application>

  <application name="librewolf">
    <!-- Librewolf: Previous tab -->
    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="SEND_KEYS">
        <modifiers>Control_L</modifiers>
        <keys>Prior</keys>
      </action>
    </gesture>

    <!-- Librewolf: Next tab -->
    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="SEND_KEYS">
        <modifiers>Control_L</modifiers>
        <keys>Next</keys>
      </action>
    </gesture>
  </application>
</touchégg>
