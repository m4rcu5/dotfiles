###############################################################
#  i3status-rust – Arc-Darker flavoured                       #
###############################################################

# -- Icons
[icons]
icons = "awesome5"

# -- Custom icon overrides
[icons.overrides]
backlight = ""
cpu = ""

# -- Use i3bar native colors
[theme]
theme = "native"

# -- Arc-Darker theme settings
[theme.overrides]
separator_fg = "#5c616c"

good_fg     = "#73d216"
info_fg     = "#5294e2"
warning_fg  = "#F27835"
critical_fg = "#FC4138"

separator   = "|"

# -- Global settings
[settings]
interval    = 2

# -- CPU usage, load, frequency with 5min load avg
[[block]]
block       = "cpu"
format      = " $icon $utilization @ $frequency "
format_alt  = " $icon $barchart $utilization "

# -- CPU temperature with °C formatting
[[block]]
block       = "temperature"
format      = " $icon $max "
format_alt  = " $icon $min min, $max max, $average avg "
info        = 70
warning     = 85

# -- Memory with zram info
[[block]]
block       = "memory"
format      = " $icon $mem_used.eng(prefix:Mi)/$mem_total.eng(prefix:Mi) ($mem_used_percents.eng(w:2)) "
format_alt  = " $icon Used: $mem_used.eng(prefix:Mi) (Buff: $buffers.eng(prefix:Mi) + Cache: $cached.eng(prefix:Mi)) {$icon_swap ZRam: $zram_compressed.eng(prefix:Mi,range:1..)|} "

# -- Backlight
[[block]]
block       = "backlight"
device      = "intel_backlight"
format      = " $icon $brightness "

# -- Volume with click-to-mute
[[block]]
block       = "sound"
driver      = "pulseaudio"
max_vol     = 200
format      = " $icon {$volume.eng(w:2) |}"
show_volume_when_muted  = true
headphones_indicator    = true

# -- Battery
[[block]]
block       = "battery"
interval    = 30
full_format = " $icon ($percentage) "
empty_format = " $icon $time_remaining ($percentage) "
format      = " $icon $time_remaining ($percentage) "

# -- Unified wired / wireless network
[[block]]
block       = "net"
device      = "^(enp.*|wlp.*)$"
interval    = 2
format      = " $icon {$signal_strength ($bitrate) @ $ssid $frequency|wired via $device} "
format_alt  = " $icon $device: $ip ↓$speed_down ↑$speed_up "

# -- Clock
[[block]]
block       = "time"
interval    = 1
format      = " $timestamp.datetime(f:' %a %d %b  %H:%M:%S') "

